[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
ast = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "abi", "metadata", "ir", "irOptimized", "storageLayout", "devdoc", "userdoc"]
extra_output_files = ["metadata", "ir", "irOptimized", "storageLayout", "devdoc", "userdoc"]
solc_version = "0.8.30"
fs_permissions = [{ access = "read", path = "out" }]
ffi = true
build_info = true
optimizer = true
optimizer_runs = 200

remappings = [
  '@openzeppelin/contracts=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts',
  '@openzeppelin/contracts-upgradeable=lib/openzeppelin-contracts-upgradeable/contracts',
  'openzeppelin-foundry-upgrades=lib/openzeppelin-foundry-upgrades/src',
  '@prb/math/src=lib/prb-math/src'
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[profile.ci]
optimizer = false
