[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
ast = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "abi", "metadata", "ir", "irOptimized", "storageLayout", "devdoc", "userdoc"]
extra_output_files = ["metadata", "ir", "irOptimized", "storageLayout", "devdoc", "userdoc"]
solc_version = "0.8.22"
fs_permissions = [{ access = "read", path = "out" }]

remappings = [
  '@openzeppelin/contracts=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts',
  '@openzeppelin/contracts-upgradeable=lib/openzeppelin-contracts-upgradeable/contracts',
  'openzeppelin-foundry-upgrades=lib/openzeppelin-foundry-upgrades/src',
  '@prb/math/src=lib/prb-math/src',
  '@layerzerolabs/lz-evm-messagelib-v2=lib/devtools/packages/oft-evm/node_modules/@layerzerolabs/lz-evm-messagelib-v2',
  '@layerzerolabs/lz-evm-protocol-v2=lib/devtools/packages/oft-evm/node_modules/@layerzerolabs/lz-evm-protocol-v2',
  '@layerzerolabs/oapp-evm=lib/devtools/packages/oapp-evm',
  '@layerzerolabs/oapp-evm-upgradeable=lib/devtools/packages/oapp-evm-upgradeable',
  '@layerzerolabs/oft-evm=lib/devtools/packages/oft-evm',
  '@layerzerolabs/oft-evm-upgradeable=lib/devtools/packages/oft-evm-upgradeable',
  '@layerzerolabs/test-devtools-evm-foundry=lib/devtools/packages/test-devtools-evm-foundry',
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[profile.solidity]
build_info = true
