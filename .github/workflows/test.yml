name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  
env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Install Dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts 
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable
          forge install OpenZeppelin/openzeppelin-foundry-upgrades
          forge install PaulRBerg/prb-math
          # Explicitly install LayerZero dependencies
          forge install LayerZero-Labs/devtools
          forge install LayerZero-Labs/layerzero-v2
          # Print installation status
          echo "Checking for EndpointV2Mock.sol:"
          find lib -name "EndpointV2Mock.sol" || echo "EndpointV2Mock.sol not found"
          echo "Devtools structure:"
          find lib/devtools -type d | sort
          echo "Layerzero-v2 structure:"
          find lib/layerzero-v2 -type d | sort | head -n 20

      - name: Copy Mock Files Manually (Fallback)
        run: |
          # Create directories if they don't exist
          mkdir -p lib/devtools/packages/test-devtools-evm-foundry/contracts/Mocks
          
          # Creating a minimal EndpointV2Mock.sol if it doesn't exist
          if [ ! -f lib/devtools/packages/test-devtools-evm-foundry/contracts/Mocks/EndpointV2Mock.sol ]; then
            echo "// SPDX-License-Identifier: LZBL-1.2
            pragma solidity ^0.8.20;
            
            import { Ownable } from \"@openzeppelin/contracts/access/Ownable.sol\";
            
            contract EndpointV2Mock is Ownable {
                uint32 public immutable eid;
                
                constructor(uint32 _eid, address _owner) Ownable(_owner) {
                    eid = _eid;
                }
            }" > lib/devtools/packages/test-devtools-evm-foundry/contracts/Mocks/EndpointV2Mock.sol
            
            echo "Created minimal EndpointV2Mock.sol"
          fi
          
      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build with warnings as errors
        run: |
          forge build --sizes --optimize --optimizer-runs 200 --deny-warnings
        id: build

      - name: Run Forge tests with warnings as errors
        run: |
          forge test -vvv --deny-warnings
        id: test
