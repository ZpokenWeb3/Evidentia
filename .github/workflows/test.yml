name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  
env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Install dependencies with Forge
        run: |
          forge install foundry-rs/forge-std
          forge install PaulRBerg/prb-math
          forge install OpenZeppelin/openzeppelin-contracts
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable
          forge install OpenZeppelin/openzeppelin-foundry-upgrades
          forge install LayerZero-Labs/layerzero-v2
          forge install GNSPS/solidity-bytes-utils
          forge install LayerZero-Labs/solidity-examples
          forge install LayerZero-Labs/LayerZero
          forge install LayerZero-Labs/devtools

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build with warnings as errors
        run: |
          forge build --sizes --optimize --optimizer-runs 200 --deny-warnings
        id: build

      - name: Run Forge tests with warnings as errors
        run: |
          forge test -vvv --deny-warnings
        id: test
