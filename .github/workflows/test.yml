name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  
env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Install OpenZeppelin Contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts 

      - name: Install PaulRBerg prb-math
        run: |
          forge install PaulRBerg/prb-math@release-v4 

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes --optimize --optimizer-runs 200
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
        
      - name: Generate coverage report
        id: coverage_summary
        run: |
          # Generate coverage data directly from forge and save to file
          forge coverage > coverage.txt
          
          # Extract coverage data for NFTStakingAndBorrowing contract
          NFT_DATA=$(grep "src/NFTStakingAndBorrowing.sol" coverage.txt)
          NFT_LINES=$(echo "$NFT_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | head -1)
          NFT_FUNCS=$(echo "$NFT_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | tail -1)
          echo "nft_lines=$NFT_LINES" >> $GITHUB_OUTPUT
          echo "nft_funcs=$NFT_FUNCS" >> $GITHUB_OUTPUT
          
          # Extract coverage data for BondNFT contract
          BOND_DATA=$(grep "src/BondNFT.sol" coverage.txt)
          BOND_LINES=$(echo "$BOND_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | head -1)
          BOND_FUNCS=$(echo "$BOND_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | tail -1)
          echo "bond_lines=$BOND_LINES" >> $GITHUB_OUTPUT
          echo "bond_funcs=$BOND_FUNCS" >> $GITHUB_OUTPUT
          
          # Extract coverage data for StableBondCoins contract
          STABLE_DATA=$(grep "src/StableBondCoins.sol" coverage.txt)
          STABLE_LINES=$(echo "$STABLE_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | head -1)
          STABLE_FUNCS=$(echo "$STABLE_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | tail -1)
          echo "stable_lines=$STABLE_LINES" >> $GITHUB_OUTPUT
          echo "stable_funcs=$STABLE_FUNCS" >> $GITHUB_OUTPUT
          
          # Extract coverage data for StableCoinsStaking contract
          STAKING_DATA=$(grep "src/StableCoinsStaking.sol" coverage.txt)
          STAKING_LINES=$(echo "$STAKING_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | head -1)
          STAKING_FUNCS=$(echo "$STAKING_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | tail -1)
          echo "staking_lines=$STAKING_LINES" >> $GITHUB_OUTPUT
          echo "staking_funcs=$STAKING_FUNCS" >> $GITHUB_OUTPUT
          
          # Extract total coverage data
          TOTAL_DATA=$(grep "Total" coverage.txt)
          TOTAL_LINES=$(echo "$TOTAL_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | head -1)
          TOTAL_FUNCS=$(echo "$TOTAL_DATA" | grep -o "[0-9]*\.[0-9]*% ([0-9]*/[0-9]*)" | tail -1)
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
          echo "total_funcs=$TOTAL_FUNCS" >> $GITHUB_OUTPUT
          
          # Format the full report as a code block for the PR comment
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$(cat coverage.txt)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: test-coverage
          message: |
            ## Test Coverage Report
            
            **Overall Coverage:** ${{ steps.coverage_summary.outputs.total_lines }} (functions: ${{ steps.coverage_summary.outputs.total_funcs }})
            
            | Contract | Line Coverage | Function Coverage |
            |----------|---------------|------------------|
            | NFTStakingAndBorrowing | ${{ steps.coverage_summary.outputs.nft_lines }} | ${{ steps.coverage_summary.outputs.nft_funcs }} |
            | BondNFT | ${{ steps.coverage_summary.outputs.bond_lines }} | ${{ steps.coverage_summary.outputs.bond_funcs }} |
            | StableBondCoins | ${{ steps.coverage_summary.outputs.stable_lines }} | ${{ steps.coverage_summary.outputs.stable_funcs }} |
            | StableCoinsStaking | ${{ steps.coverage_summary.outputs.staking_lines }} | ${{ steps.coverage_summary.outputs.staking_funcs }} |
            
            <details>
            <summary>Full Coverage Report</summary>
            
            ```
            ${{ steps.coverage_summary.outputs.report }}
            ```
            </details>
